<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate Area Of Circle</title>
</head>
<body>
    <h2>Calculate Area Of Circle</h2>
    <label>Enter the radius of the circle:</label>
    <input type="number" id="radius" placeholder="Enter radius">
    <button onclick="calculateArea()">Calculate Area</button>
    <p id="result"></p>
    <script>    
        function calculateArea() {
            let radius = document.getElementById("radius").value;
            let area = Math.PI * radius * radius;
            document.getElementById("result").innerHTML = "Area of the circle: " + area.toFixed(2);
        }
    </script>
</body>
</html>
